name: release

# Release CI for spidermonkey-wasm. Triggered only by a `v*` tag, it runs the
# exact same wasmify pipeline as build.yml (so the released artifacts are rebuilt
# from the tagged source, not promoted from an unverified earlier run), stages the
# four release assets, attaches SLSA build-provenance attestations, and creates
# the GitHub Release.
#
# Assets (mirrors python-wasm's asset set, minus the stdlib zip — SpiderMonkey's
# standard library is compiled into the engine, so there is nothing to ship
# alongside):
#   * spidermonkey.wasm            — raw wasi-sdk artifact (binaryen-optimised).
#   * spidermonkey_wasm2go.go      — protoc-gen-wasmify-go's wasm2go bridge.
#   * spidermonkey_wasm2go.tar.gz  — the github.com/goccy/spidermonkeywasm2go
#                                    module (build/wasm2go/internal/internal/
#                                    wasm2go), self-contained after bundle-gomod,
#                                    which go-spidermonkey downloads and extracts.
#   * spidermonkey_wasm2go.sha256  — sha256sum manifest of the tarball contents;
#                                    doubles as the attestation subject-checksums
#                                    so any extracted file verifies individually.
#
# Releasing lives ONLY here, never in build.yml — so pull requests and main
# pushes build and verify but never publish. No `tags:` trigger in build.yml
# means a tag push runs this workflow alone (no double build, no race).
#
# The pipeline runs on the host, not in ghcr.io/goccy/wasmify: the image has no
# Rust toolchain, and `make deps` builds a Rust staticlib. See build.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # create the GitHub Release + upload assets
  id-token: write          # actions/attest-build-provenance OIDC token
  attestations: write

env:
  # Keep in lock-step with build.yml.
  WASMIFY_VERSION: v0.5.0

jobs:
  # Build the with-Intl engine from source (ICU + Temporal + shared memory +
  # the wasi patches — see scripts/build-engine-intl.sh) and hand the archive
  # to the jobs below via SPIDERMONKEY_LOCAL_ARCHIVE.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install wasi-sdk 30
        run: |
          curl -fL --proto '=https' --tlsv1.2 -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-30.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Install rust 1.88 (wasm32-wasip1) + cbindgen
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add wasm32-wasip1
          cargo install cbindgen --locked
      - name: Cache engine build
        uses: actions/cache@v4
        with:
          path: build/spidermonkey-static-intl-release.tar.gz
          # -threads keys this to the wasi-threads flavor: the bundle links with
          # --shared-memory, so every object (jsrust included) must carry
          # atomics+bulk-memory. Matches build.yml.
          key: engine-intl-threads-${{ runner.os }}-${{ hashFiles('scripts/build-engine-intl.sh', 'starlingmonkey/cmake/spidermonkey.cmake') }}
      - name: Build engine with Intl (wasi-threads)
        env:
          SPIDERMONKEY_THREADS: "1"
        run: |
          if [ ! -f build/spidermonkey-static-intl-release.tar.gz ]; then
            bash scripts/build-engine-intl.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: engine-intl
          path: build/spidermonkey-static-intl-release.tar.gz
          if-no-files-found: error

  release:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space on the runner
        # Reclaim the unused language SDKs; the engine archive, transpiled Go
        # tree and gcasm build cache crowd the runner's ~14 GB. See build.yml.
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          # StarlingMonkey is a submodule: it pins the SpiderMonkey version
          # scripts/fetch-spidermonkey.sh downloads, and it carries the Rust
          # crates rust/ links against.
          submodules: recursive

      - name: Fetch the with-Intl engine archive
        uses: actions/download-artifact@v4
        with:
          name: engine-intl
          path: /tmp/engine
      - name: Point the pipeline at the local engine archive
        run: echo "SPIDERMONKEY_LOCAL_ARCHIVE=/tmp/engine/spidermonkey-static-intl-release.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install wasmify + the protoc plugin
        run: |
          go install github.com/goccy/wasmify/cmd/wasmify@${{ env.WASMIFY_VERSION }}
          go install github.com/goccy/wasmify/protoc-plugins/protoc-gen-wasmify-go@${{ env.WASMIFY_VERSION }}

      - uses: bufbuild/buf-setup-action@v1

      - name: Cache wasmify state
        uses: actions/cache@v4
        with:
          path: |
            .wasmify
            ~/.config/wasmify/bin
          key: wasmify-${{ env.WASMIFY_VERSION }}-${{ runner.os }}-${{ hashFiles('wasmify.json', 'build.json', 'js.h', 'js.cc') }}
          restore-keys: |
            wasmify-${{ env.WASMIFY_VERSION }}-${{ runner.os }}-

      - name: Cache the prebuilt engine + Rust staticlib
        uses: actions/cache@v4
        with:
          path: rust/target
          key: rustlib-${{ runner.os }}-${{ hashFiles('starlingmonkey/cmake/spidermonkey.cmake', 'starlingmonkey/rust-toolchain.toml', 'rust/Cargo.lock') }}

      - name: Run the wasmify pipeline
        run: make wasm

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp .wasmify/wasm-build/output/spidermonkey.wasm release/spidermonkey.wasm
          # The generated bridge (package `internal`): go-spidermonkey commits it
          # at internal/spidermonkey.go. buf writes it under the go_package dir,
          # so it is build/wasm2go/internal/spidermonkey.go, not the out root.
          cp build/wasm2go/internal/spidermonkey.go release/spidermonkey_wasm2go.go
          # The wasm2go runtime is its own module (github.com/goccy/
          # spidermonkeywasm2go); tar its contents so extraction yields the
          # module AT ITS ROOT. Its on-disk build/wasm2go/internal/internal/
          # wasm2go location is just where buf dumps it under the go_package dir.
          bundle=build/wasm2go/internal/internal/wasm2go
          tar -czf release/spidermonkey_wasm2go.tar.gz -C "$bundle" .
          ( cd "$bundle" && find . -type f -print0 | sort -z \
              | xargs -0 sha256sum ) > release/spidermonkey_wasm2go.sha256
          # The bundle is only usable as a Go module; bundle-gomod must have run.
          test -f "$bundle/go.mod" \
            || { echo "::error::bundle go.mod missing — make bundle-gomod did not run"; exit 1; }

      - uses: actions/attest-build-provenance@v2
        # Provenance for the wasm + the wasm2go bridge. Skipped on user-owned
        # private repos (the attestations API rejects those); re-enables itself
        # when the repo is public.
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            release/spidermonkey.wasm
            release/spidermonkey_wasm2go.go

      - uses: actions/attest-build-provenance@v2
        # wasm2go bundle: one attestation whose subjects are the per-file digests
        # in the manifest, so any file extracted from the tarball verifies
        # individually.
        if: github.event.repository.visibility == 'public'
        with:
          subject-checksums: release/spidermonkey_wasm2go.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/spidermonkey.wasm
            release/spidermonkey_wasm2go.go
            release/spidermonkey_wasm2go.tar.gz
            release/spidermonkey_wasm2go.sha256
